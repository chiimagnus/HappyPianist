[project]
name = "happy-pianist-laya-server"
version = "0.0.1"
description = "Local Laya-MLX typed decision service for HappyPianist."
requires-python = ">=3.11,<3.14"

dependencies = [
    "aiohttp",
    "laya-mlx==0.2.0",
    "pydantic>=2",
    "zeroconf",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
