[project]
name = "aria-server"
version = "0.0.1"
description = "HappyPianist Aria v2 local HTTP+Bonjour server."
requires-python = ">=3.11"

dependencies = [
    "aria",
    "mido",
    "safetensors",
    "torch>=2.3",
    "pydantic>=2",
    "zeroconf",
    "numpy",
    "aiohttp",
]

[tool.uv.sources]
aria = { path = "../aria", editable = true }
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
